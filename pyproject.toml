[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holehe-v2"
version = "2.0.0"
description = "Fast, async, and modular OSINT tool to check if an email is registered across platforms."
readme = "README.md"
authors = [
    { name = "Anubhav Kashyap" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "httpx[http2]>=0.27.0",
]

[project.scripts]
holehe_v2 = "holehe_v2.__main__:main"

[tool.setuptools.packages.find]
include = ["holehe_v2", "holehe_v2.*"]
