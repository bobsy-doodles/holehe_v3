[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holehe_v2"
version = "1.0.0"
description = "Check if an email is registered across platforms"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Anubhav Kashyap", email = "your@email.com" }
]
keywords = ["osint", "email", "reconnaissance", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/anubhavanonymous/holehe_v2"

[tool.setuptools.packages.find]
where = ["."]
include = ["holehe_v2*"]
